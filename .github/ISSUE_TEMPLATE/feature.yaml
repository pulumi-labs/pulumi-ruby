name: Feature request
description: Something the Ruby SDK should be able to do
labels: ["kind/enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, rather than a proposed solution.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: How would you like it to work?
