name: Bug report
description: Something in the Ruby SDK or language host does not work
labels: ["kind/bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Ruby support is experimental and community-supported. See the README for what is
        and is not implemented yet.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the program, the command you ran, and the full output.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations: { required: true }
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `pulumi about` and `ruby --version`.
    validations: { required: true }
