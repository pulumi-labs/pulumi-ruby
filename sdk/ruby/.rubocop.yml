plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    # Generated by grpc_tools_ruby_protoc.
    - "lib/pulumi/runtime/proto/**/*"
    - "vendor/**/*"

# The SDK mirrors a gRPC protocol with long, flat message shapes; method length and
# ABC size limits fight that without improving anything.
Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
Metrics/ClassLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false

Layout/LineLength:
  Max: 120

Style/Documentation:
  Enabled: false

# Asset and Archive are abstract bases that exist purely so `case value when Asset`
# dispatch works. An explanatory comment in the body is the honest way to say so.
Lint/EmptyClass:
  AllowComments: true

# Double quotes throughout, matching `bundle gem` scaffolding and the Standard style
# most modern gems follow.
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Pulumi's wire protocol distinguishes "absent" from "explicit nil" in places, so
# `unless x.nil?` is deliberate and not interchangeable with `if x`.
Style/IfUnlessModifier:
  Enabled: false

# The SDK wraps Kernel#format, so every token style it accepts is legitimate here and
# the specs must exercise the unannotated ones.
Style/FormatStringToken:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/NestedGroups:
  Max: 5
